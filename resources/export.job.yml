resources:
  jobs:
    export_job:
      name: bikeshare_export_daily_animation
      max_concurrent_runs: 1
      timeout_seconds: 600
      schedule:
        quartz_cron_expression: "0 40 6 * * ?"     # daily at 06:40, after the 05:20 weather pull and the 06:10 pipeline refresh
        timezone_id: Europe/Zurich
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: exports
        - name: days
          default: "7"
      tasks:
        - task_key: export_daily_animation
          notebook_task:
            notebook_path: ../src/export/export_daily_animation.ipynb
          max_retries: 1
          min_retry_interval_millis: 60000
