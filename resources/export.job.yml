resources:
  jobs:
    export_job:
      name: bikeshare_export_daily_animation
      max_concurrent_runs: 1
      timeout_seconds: 600
      schedule:
        quartz_cron_expression: "0 30 12 * * ?"    # daily at 12:30, after the 12:10 pipeline refresh; by then "bikes out" for all of yesterday is final (its +/-12 h baseline needs data up to 11:00)
        timezone_id: Europe/Zurich
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: exports
        - name: days
          default: "7"
        - name: end_date
          default: ""                                # yyyy-MM-dd, local date; empty = the day before the export (daily run)
      tasks:
        - task_key: export_daily_animation
          notebook_task:
            notebook_path: ../src/export/export_daily_animation.ipynb
          max_retries: 1
          min_retry_interval_millis: 60000
