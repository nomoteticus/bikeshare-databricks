resources:
  jobs:
    pull_job:
      name: bikeshare_pull_status
      max_concurrent_runs: 1
      timeout_seconds: 600
      schedule:
        quartz_cron_expression: "0 0/30 * * * ?"     # every 30 min
        timezone_id: Europe/Zurich
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: raw
        - name: feeds
          default: station_status
      tasks:
        - task_key: pull_gbfs
          notebook_task:
            notebook_path: ../src/ingestion/pull_gbfs.ipynb
          max_retries: 2
          min_retry_interval_millis: 60000

    reference_job:
      name: bikeshare_pull_reference
      max_concurrent_runs: 1
      timeout_seconds: 600
      schedule:
        quartz_cron_expression: "0 15 4 * * ?"       # daily at 04:15
        timezone_id: Europe/Zurich
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: volume
          default: raw
        - name: feeds
          default: station_information,providers,system_regions
      tasks:
        - task_key: pull_gbfs
          notebook_task:
            notebook_path: ../src/ingestion/pull_gbfs.ipynb
          max_retries: 2
          min_retry_interval_millis: 60000

    refresh_job:
      name: bikeshare_refresh
      max_concurrent_runs: 1
      timeout_seconds: 1800
      schedule:
        quartz_cron_expression: "0 10 * * * ?"       # hourly at :10, after the :00 pull
        timezone_id: Europe/Zurich
      tasks:
        - task_key: refresh_stations
          pipeline_task:
            pipeline_id: ${resources.pipelines.stations_pipeline.id}