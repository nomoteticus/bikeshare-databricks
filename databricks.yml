bundle:
  name: bikeshare

include:
  - resources/*.yml          # job + pipeline come here in 4d/4e

variables:
  catalog:
    description: Unity Catalog catalog for this environment
    default: dev             # which one is the safe default?
  schema:
    description: Schema for the bikeshare tables
    default: bikeshare

targets:
  dev:
    mode: development                # prefixes names, pauses schedules
    default: true
    workspace:
      host: https://dbc-9de0b6d2-be29.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-9de0b6d2-be29.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod           # override for prod