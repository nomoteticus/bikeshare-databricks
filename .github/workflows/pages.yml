# Publishes the daily animation (visualizations/daily-animation/) to GitHub Pages.
#
# Data: before the upload, the newest export is downloaded from the Unity Catalog volume
# (.github/scripts/fetch_daily_animation.py), so the daily data never enters Git history.
# The JSON files committed under visualizations/daily-animation/data/ are a fallback snapshot:
# they are published only while the DATABRICKS_TOKEN secret is not set, or on a manual run
# with data = snapshot.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   DATABRICKS_HOST   workspace URL (https://dbc-....cloud.databricks.com)
#   DATABRICKS_TOKEN  token that can read /Volumes/prod/bikeshare/exports
#
# If the download fails or the export is stale, the run fails and the last deployment stays online.
name: Publish daily animation

on:
  push:
    branches: [main]
    paths:
      - 'visualizations/daily-animation/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/fetch_daily_animation.py'
  schedule:
    # Daily at 12:20 UTC = 13:20 in winter, 14:20 in summer (Zurich time); cron is always UTC.
    # The export job writes the files at 12:30 Zurich time. GitHub may start scheduled runs late,
    # and pauses schedules in public repos after 60 days without repository activity.
    - cron: '20 12 * * *'
  workflow_dispatch:  # "Run workflow" button in the Actions tab
    inputs:
      data:
        description: 'Data to publish'
        type: choice
        options: [latest, snapshot]
        default: latest

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a running deployment is not cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download the latest export from Databricks
        if: ${{ inputs.data != 'snapshot' }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          # The scheduled run needs data that ends yesterday. Other runs (a push in the morning,
          # before the 12:30 export) also accept the export of the day before.
          MAX_AGE_DAYS: ${{ github.event_name == 'schedule' && '1' || '2' }}
        run: >
          python3 .github/scripts/fetch_daily_animation.py
          --out visualizations/daily-animation/data
          --max-age-days "$MAX_AGE_DAYS"
      - uses: actions/configure-pages@v5
      - name: Upload the site folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: visualizations/daily-animation

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
