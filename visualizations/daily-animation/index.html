<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swiss bike-share, hour by hour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
  :root { --ink: #1d2230; --muted: #4b5263; --line: #cdd1d9; --bg: #f4f5f7; --accent: #ff7a1a; --ok: #16a34a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
  .page { max-width: 1200px; margin: 0 auto; padding: 16px 12px 24px; }
  .intro { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin: 4px 4px 12px; }
  .intro h1 { margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 26px; letter-spacing: -0.4px; }
  .intro p { margin: 0; color: var(--muted); font-size: 14px; }
  #stageWrap { position: relative; width: 100%; overflow: hidden; border-radius: 14px 14px 0 0; background: #dfeaf2; }
  #stage { position: absolute; left: 0; top: 0; width: 1200px; height: 640px; transform-origin: 0 0; }
  #scene { position: absolute; left: 0; top: 0; width: 1200px; height: 640px; display: block; }
  .panel { position: absolute; top: 20px; height: 120px; background: rgba(255,255,255,0.92); border-radius: 16px; box-shadow: 0 4px 18px rgba(10,16,40,0.18); }
  #cityPanel { left: 20px; width: 330px; overflow: hidden; padding: 10px 16px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
  .city-btn { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 3px; border-radius: 10px; padding: 2px 6px; margin: -2px -6px; }
  .city-btn:hover { background: rgba(29,34,48,0.06); }
  .city-btn:focus-visible { outline: 3px solid #2f6fd6; outline-offset: 2px; }
  .city-row { display: flex; align-items: center; gap: 8px; }
  #cityName { font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.05; }
  .chev { width: 22px; height: 22px; border-radius: 999px; background: #eef0f4; display: inline-flex; align-items: center; justify-content: center; transition: transform 0.15s; }
  .city-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .city-hint { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; font-size: 12px; font-weight: 600; color: #2457a6; background: #e8f0fd; padding: 3px 10px; border-radius: 999px; }
  .city-btn:hover .city-hint { background: #d8e6fc; }
  .city-hint.pulse { animation: pulse 1.6s ease-in-out 3; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(47,111,214,0.0); } 50% { box-shadow: 0 0 0 6px rgba(47,111,214,0.25); } }
  .stats { display: flex; gap: 12px; font-size: 13px; color: #3b4252; white-space: nowrap; }
  .stats b { font-size: 17px; color: var(--ink); }
  /* fixed slots: only the numbers change, the words stay in place (right-aligned, equal-width digits).
     Widths fit the largest expected value: 9,999 docked, ~999 out, 100% active. */
  .stats b.num { display: inline-block; text-align: right; font-variant-numeric: tabular-nums; }
  .stats .w-docked { width: 4.5ch; } .stats .w-out { width: 4.1ch; } .stats .w-active { width: 4.7ch; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw-line { display: inline-block; width: 18px; height: 4px; border-radius: 2px; background: var(--accent); }
  .sw-dash { display: inline-block; width: 18px; height: 0; border-top: 2px dashed #6b7280; }
  #cityList { position: absolute; left: 20px; top: 146px; width: 330px; max-height: 470px; overflow-y: auto; margin: 0; padding: 6px; list-style: none; background: #ffffff; border-radius: 14px; box-shadow: 0 10px 30px rgba(10,16,40,0.28); z-index: 5; }
  #cityList li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
  #cityList li small { font-weight: 500; color: var(--muted); font-size: 12px; }
  #cityList li[aria-selected="true"] { background: #e8f0fd; color: #163a73; }
  #cityList li.active, #cityList li:hover { background: #f1f3f6; }
  #cityList li[aria-selected="true"].active, #cityList li[aria-selected="true"]:hover { background: #d8e6fc; }
  #clockPanel { left: 50%; transform: translateX(-50%); width: 380px; padding: 10px 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .clock { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 190px; }
  #dayLabel { font-size: 15px; font-weight: 600; color: #3b4252; }
  #timeLabel { font-family: 'Space Grotesk', Inter, sans-serif; font-size: 56px; line-height: 1; font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .round { width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--line); background: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .round:disabled { opacity: 0.3; cursor: default; }
  #weatherPanel { right: 20px; width: 330px;   /* same as #cityPanel, so the centered clock panel has equal gaps on both sides */ padding: 12px 18px; display: flex; align-items: center; gap: 14px; }
  #weatherPanel .wx-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  #weatherPanel .wx-text div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #fcLabel { font-size: 11px; font-weight: 600; color: #8a5a00; height: 15px; }
  #tempLabel { font-family: 'Space Grotesk', Inter, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
  #condLabel { font-size: 13px; font-weight: 600; color: #3b4252; }
  #cloudLabel { font-size: 12px; color: #5b6272; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 18px; background: #fff; border-top: 1px solid #e3e5ea; }
  .controls label, .controls .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .timeline { flex: 1 1 280px; min-width: 220px; }
  .timeline input { width: 100%; accent-color: var(--ink); }
  select { height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); font: inherit; font-size: 14px; color: var(--ink); background: #fff; }
  #playBtn { width: 48px; height: 48px; border-radius: 999px; border: none; background: var(--ink); color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .seg { display: flex; height: 36px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: none; padding: 0 12px; font: inherit; font-size: 14px; cursor: pointer; background: #fff; color: var(--ink); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .foot a { color: #2f5d8a; text-decoration: underline; }
  .foot .line { display: block; }
  .foot .line + .line { margin-top: 3px; }
  .foot b { color: #3b4252; font-weight: 600; }
  .foot { margin: 0; padding: 8px 18px 12px; font-size: 11.5px; line-height: 1.5; color: #5b6272; background: #fff; border-radius: 0 0 14px 14px; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--muted); }
</style>
</head>
<body>
<main class="page">
  <div class="intro">
    <h1>Swiss bike-share, hour by hour</h1>
    <p>Docked bikes, bikes out, active stations and weather over the last days, replayed.</p>
  </div>
  <div id="stageWrap">
    <div id="stage">
      <canvas id="scene" width="1200" height="640" role="img" aria-label="Animated city scene"></canvas>
      <div id="loading">Loading data…</div>

      <div id="cityPanel" class="panel">
        <button id="cityBtn" class="city-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="cityList">
          <span class="city-row">
            <span id="cityName">…</span>
            <span class="chev" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 4.5 L6 8 L9.5 4.5" fill="none" stroke="#1d2230" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </span>
          <span id="cityHint" class="city-hint">
            <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 4.5 H11 M8.5 2 L11 4.5 L8.5 7 M12 9.5 H3 M5.5 7 L3 9.5 L5.5 12" fill="none" stroke="#2457a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="hintText">Change city</span>
          </span>
        </button>
        <div class="stats"><div><b id="dockedLabel" class="num w-docked">–</b> in docks</div><div><b id="outLabel" class="num w-out">–</b> out</div><div title="Share of the city's stations whose bike count changed during the hour"><b id="activeLabel" class="num w-active">–</b> active</div></div>
        <div class="legend"><span><i class="sw-line"></i><span id="legendToday">Out today</span></span><span><i class="sw-dash"></i>Yesterday</span></div>
      </div>
      <ul id="cityList" role="listbox" aria-label="Choose a city" tabindex="-1" hidden></ul>

      <div id="clockPanel" class="panel">
        <button id="prevDay" class="round" type="button" aria-label="Previous day"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11.5 3.5 L6 9 L11.5 14.5" fill="none" stroke="#1d2230" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="clock"><div id="dayLabel">–</div><div id="timeLabel">--:--</div></div>
        <button id="nextDay" class="round" type="button" aria-label="Next day"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M6.5 3.5 L12 9 L6.5 14.5" fill="none" stroke="#1d2230" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>

      <div id="weatherPanel" class="panel">
        <svg id="wxIcon" width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"></svg>
        <div class="wx-text"><div id="tempLabel">–</div><div id="condLabel">–</div><div id="cloudLabel">–</div><div id="fcLabel"></div></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="playBtn" type="button" aria-label="Play"></button>
    <label class="timeline"><span id="windowLabel">Timeline</span><input id="scrub" type="range" min="0" max="1" step="1" value="0"></label>
    <label>Look back<select id="daysSel"><option value="1">Today</option><option value="3">3 days</option><option value="7" selected>7 days</option></select></label>
    <label>Speed<select id="speedSel"><option value="0.25">0.25 s/h</option><option value="0.5">0.5 s/h</option><option value="1" selected>1 s/h</option><option value="2">2 s/h</option></select></label>
    <label>Chart shows<select id="modeSel"><option value="out" selected>Bikes out</option><option value="docked">Bikes docked</option><option value="active">Active stations (%)</option></select></label>
    <label>Bikes<select id="styleSel"><option value="bikes" selected>Bikes only</option><option value="slate">Slate pastel</option><option value="red">Classic red</option><option value="teal">Deep teal</option><option value="hivis">Hi-vis commuter</option></select></label>
  </div>
  <p class="foot" id="foot"></p>
</main>

<script>
/* Daily animation: plays gold_city_hour exports (data/cities.json + data/<city_id>.json).
   All business logic (data status, imputation, bikes out, sun) comes from the pipeline; this page only draws. */
(() => {
  'use strict';
  const W = 1200, H = 640, STREET = 470, X0 = 250, X1 = 1180, CH_TOP = 180, CH_BOT = 462;
  const XW = X1 - X0;
  const $ = (id) => document.getElementById(id);
  const canvas = $('scene'), ctx = canvas.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = W * dpr; canvas.height = H * dpr; ctx.scale(dpr, dpr);

  // ---------- backgrounds (generated by the same code as the design canvas; chosen variant per city) ----------
  const BG_PICK = { 'Zürich': ['zurich', 'A'], 'Genève': ['geneve', 'A'], 'Bern': ['bern', 'A'], 'Basel': ['basel', 'B'], 'Luzern': ['luzern', 'A'],
    'Locarno': ['locarno', 'C'], 'Sion': ['sion', 'B'], 'Yverdon-les-Bains': ['yverdon', 'A'], 'Lugano': ['lugano', 'C'], 'Fribourg': ['fribourg', 'B'],
    'Biel/Bienne': ['biel', 'A'], 'Neuchâtel': ['neuchatel', 'A'], 'Chur': ['chur', 'C'] };
  function buildBackgrounds() {
    const B = 470;
    const f = (v) => Math.round(v * 10) / 10;
    let seed = 11;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const R = (x, y, w, h, fill, op) => ({ isRect: true, x: f(x), y: f(y), w: f(w), h: f(h), fill: fill, op: op ?? 1 });
    const P = (pts, fill, op) => ({ isPoly: true, pts: pts.map((p) => f(p[0]) + ',' + f(p[1])).join(' '), fill: fill, op: op ?? 1 });
    const C = (cx, cy, r, fill, op) => ({ isCirc: true, cx: f(cx), cy: f(cy), r: f(r), fill: fill, op: op ?? 1 });
    const E = (cx, cy, rx, ry, fill, op) => ({ isEll: true, cx: f(cx), cy: f(cy), rx: f(rx), ry: f(ry), fill: fill, op: op ?? 1 });
    const D = (d, fill, stroke, sw, op) => ({ isPath: true, d: d, fill: fill || 'none', stroke: stroke || 'none', sw: sw || 0, op: op ?? 1 });

    const SKY = '#d6eefb', SKY2 = '#f1f9fe', WIN = '#6b7385', STONE = '#ddd0b8', STONE2 = '#c9bba0';
    const GREENR = '#4f8a6e', SAND = '#c0584a', LAKE = '#8cc6e3', LAKE2 = '#b3dbef', MTN = '#a7b8cc';
    const HILL = '#a3c193', HILL2 = '#8db27f', TREE = '#6a9a5f', DARK = '#4a4f5c', SNOW = '#ffffff';
    const WALLS = ['#efe3cf', '#e8d5bf', '#f3ead9', '#dfe6e9', '#eadccd', '#f1dcc4'];
    const ROOFS = ['#b85c45', '#9c4f3e', '#c76d4f', '#8f5a44'];
    const GREYROOFS = ['#6b7a8f', '#5f6b7d', '#7a8798'];
    const YELLOW = ['#ecd496', '#e6c77d', '#f0dca8', '#dcb86a'];
    const PASTEL = ['#f3d9a6', '#efc7a8', '#f5e6b8', '#e9d1c4', '#d9e4d0', '#f2cfa0'];

    const sky = () => [R(0, 0, 1200, 470, SKY), R(0, 300, 1200, 170, SKY2, 0.7)];
    const street = () => [];                                  // the page draws its own street
    const mountains = (peaks, color, snow, base) => {
      const s = [];
      peaks.forEach((p) => {
        const cx = p[0], top = p[1], half = p[2], b = base ?? B;
        s.push(P([[cx - half, b], [cx, top], [cx + half, b]], color));
        if (snow) {
          const k = half * snow, d = (b - top) * snow;
          s.push(P([[cx - k, top + d], [cx - k * 0.4, top + d * 0.72], [cx - k * 0.05, top + d], [cx + k * 0.35, top + d * 0.7], [cx + k, top + d], [cx, top]], SNOW));
        }
      });
      return s;
    };
    const ridge = (pts, color, base) => [P([[pts[0][0], base ?? B]].concat(pts, [[pts[pts.length - 1][0], base ?? B]]), color)];
    const lake = (y0, x0, x1) => {
      const a = x0 ?? 0, b = x1 ?? 1200, s = [R(a, y0, b - a, B - y0, LAKE)];
      for (let i = 0; i < 6; i++) s.push(R(a + 40 + ((i * 197) % Math.max(1, b - a - 120)), y0 + 12 + ((i * 23) % Math.max(1, B - y0 - 16)), 70, 2.5, LAKE2));
      return s;
    };
    const houses = (x0, x1, hmin, hmax, o) => {
      o = o || {};
      const s = [], base = o.base ?? B, walls = o.walls || WALLS, roofs = o.roofs || ROOFS, roofH = o.roofH ?? 24;
      let x = x0, k = 0;
      while (x < x1 - 20) {
        const w = Math.min(x1 - x, 40 + rnd() * 36), h = hmin + rnd() * (hmax - hmin), y = base - h;
        s.push(R(x, y, w, h, walls[k % walls.length]));
        if (o.flat) s.push(R(x - 2, y - 5, w + 4, 5, roofs[k % roofs.length]));
        else s.push(P([[x - 3, y], [x + w / 2, y - roofH * (o.steep ? 1.8 : 1)], [x + w + 3, y]], roofs[k % roofs.length]));
        const cols = Math.floor((w - 10) / 15), rows = Math.floor((h - 18) / 22);
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) s.push(R(x + 8 + c * 15 + (w - 10 - cols * 15) / 2, y + 10 + r * 22, 7, 10, WIN, 0.75));
        x += w + 4; k++;
      }
      if (o.op !== undefined) s.forEach((sh) => { sh.op = o.op; });
      return s;
    };
    const blocks = (x0, x1, hmin, hmax) => {
      const s = [], cols = ['#d5d9de', '#c4cbd3', '#e1e4e8', '#b9c3cc'];
      let x = x0, k = 0;
      while (x < x1 - 20) {
        const w = Math.min(x1 - x, 60 + rnd() * 50), h = hmin + rnd() * (hmax - hmin);
        s.push(R(x, B - h, w, h, cols[k % 4]));
        for (let yy = B - h + 10; yy < B - 12; yy += 16) s.push(R(x + 6, yy, w - 12, 5, '#8796a5', 0.5));
        x += w + 6; k++;
      }
      return s;
    };
    const tower = (x, w, h, o) => {
      o = o || {};
      const base = o.base ?? B, col = o.color || STONE, top = base - h, s = [R(x, top, w, h, col)];
      const tc = o.topColor || GREENR;
      if (o.top === 'spire') s.push(P([[x - 3, top], [x + w / 2, top - (o.sh || w * 2.2)], [x + w + 3, top]], tc));
      if (o.top === 'pyramid') s.push(P([[x - 3, top], [x + w / 2, top - (o.sh || w * 0.9)], [x + w + 3, top]], o.topColor || ROOFS[0]));
      if (o.top === 'dome') { s.push(E(x + w / 2, top, w / 2 + 2, w * 0.42, o.topColor || DARK)); s.push(R(x + w / 2 - 2, top - w * 0.42 - 10, 4, 10, o.topColor || DARK)); }
      if (o.top === 'flat') for (let i = 0; i < w; i += 12) s.push(R(x + i, top - 7, 7, 7, col));
      if (o.clock) { s.push(C(x + w / 2, top + w * 0.6, w * 0.3, DARK)); s.push(C(x + w / 2, top + w * 0.6, w * 0.23, '#e8c25a')); }
      if (h > 90) { s.push(R(x + w / 2 - 3, top + h * 0.45, 6, 15, WIN, 0.8)); s.push(R(x + w / 2 - 3, top + h * 0.68, 6, 15, WIN, 0.8)); }
      return s;
    };
    const church = (x, w, h, o) => {
      o = o || {};
      const base = o.base ?? B;
      return [R(x, base - h, w, h, o.color || STONE), P([[x - 4, base - h], [x + w / 2, base - h - (o.roofH || 34)], [x + w + 4, base - h]], o.roof || ROOFS[1])];
    };
    const bridgeStone = (x0, x1, deck, water, n, color) => {
      const s = [R(x0, deck, x1 - x0, water - deck, color || STONE2), R(x0, deck - 5, x1 - x0, 5, '#8d806a')];
      const span = (x1 - x0) / n;
      for (let i = 0; i < n; i++) {
        const a = x0 + i * span + span * 0.14, b = a + span * 0.72, r = (b - a) / 2;
        s.push(D('M ' + f(a) + ' ' + water + ' A ' + f(r) + ' ' + f(Math.min(r, (water - deck) * 0.8)) + ' 0 0 1 ' + f(b) + ' ' + water + ' Z', LAKE));
      }
      return s;
    };
    const fountain = (x, base, top) => [
      E(x - 14, top + 30, 12, 26, '#ffffff', 0.35), E(x + 14, top + 30, 12, 26, '#ffffff', 0.35),
      P([[x - 5, base], [x - 1.5, top], [x + 1.5, top], [x + 5, base]], '#ffffff', 0.92), E(x, top, 16, 10, '#ffffff', 0.8)
    ];
    const palm = (x, base) => {
      const tx = x + 4, ty = base - 82, s = [D('M ' + x + ' ' + base + ' Q ' + (x + 9) + ' ' + (base - 42) + ' ' + tx + ' ' + ty, 'none', '#7a5a3a', 6)];
      [[-40, 12], [40, 12], [-28, 26], [28, 26], [-10, -18], [12, -16]].forEach((p) => s.push(D('M ' + tx + ' ' + ty + ' Q ' + (tx + p[0] / 2) + ' ' + (ty - 14) + ' ' + (tx + p[0]) + ' ' + (ty + p[1]), 'none', '#4f8a4a', 6)));
      return s;
    };
    const tree = (x, base, r) => [R(x - 3, base - r * 0.9, 6, r * 0.9, '#7a5a3a'), C(x, base - r * 1.4, r, TREE)];
    const trees = (x0, x1, step, base, r) => { let s = []; for (let x = x0; x <= x1; x += step) s = s.concat(tree(x, base, r)); return s; };
    const boat = (x, y) => [P([[x - 20, y], [x + 20, y], [x + 13, y + 7], [x - 13, y + 7]], '#ffffff'), P([[x, y - 2], [x, y - 38], [x + 17, y - 4]], '#ffffff', 0.95)];
    const steamer = (x, y) => [P([[x - 70, y], [x + 70, y], [x + 58, y + 14], [x - 58, y + 14]], '#ffffff'), R(x - 50, y - 18, 100, 18, '#f3f4f6'), R(x - 6, y - 36, 12, 18, '#c8102e'), R(x - 70, y - 3, 140, 3, '#2f6f8f')];
    const castle = (x, w, h, base) => {
      const b = base ?? B, s = [R(x, b - h, w, h, STONE)];
      for (let i = 0; i < w; i += 14) s.push(R(x + i, b - h - 8, 8, 8, STONE));

      ctx.save(); ctx.translate(cx, 0); ctx.rotate(spin); ctx.strokeStyle = style.spoke; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.moveTo(0, -10); ctx.lineTo(0, 10); ctx.stroke(); ctx.restore();
    });
    ctx.strokeStyle = style.frame; ctx.lineWidth = 3;
    ctx.stroke(new Path2D('M-17 0 L-3 -16 L12 -16 L17 0 M-3 -16 L0 0 L-17 0 M12 -16 L10 -24 M7 -25 L14 -25 M-7 -21 L1 -21'));
    if (style.rider) {
      ctx.strokeStyle = style.jacket; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(-2, -21); ctx.lineTo(4, -42); ctx.stroke();
      ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(3, -37); ctx.lineTo(11, -25); ctx.stroke();
      ctx.strokeStyle = style.legs; ctx.beginPath(); ctx.moveTo(-2, -21); ctx.lineTo(3, -10); ctx.lineTo(1, -2); ctx.stroke();
      ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(6, -50, 6.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = style.helmet; ctx.beginPath(); ctx.arc(6, -51, 7, Math.PI, 0); ctx.closePath(); ctx.fill();
    }
    if (night > 0.05) { ctx.globalAlpha = alpha * night; ctx.fillStyle = '#ffe680'; ctx.beginPath(); ctx.arc(20, -18, 3.5, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }

  function draw() {
    const d = cur(); if (!d) return;
    const w = windowOf(d), t = clamp(st.t, 0, w.tMax), a = w.start + t, clock = st.clock;
    const i0 = Math.floor(a + 1e-9), h0 = d.hours[i0];
    const dayStart = d.firstIdx[h0.date_local], hod = a - dayStart, px = X0 + hod / 24 * XW;
    const elev = at(d, 'sun_elevation_deg', a), cloud = at(d, 'cloud_cover_pct', a) ?? 0, temp = at(d, 'temperature_c', a);
    const hNear = d.hours[Math.min(d.hours.length - 1, Math.round(a))];
    const kind = hNear.precipitation_kind, precip = hNear.precipitation_mm || 0, snow = hNear.snowfall_cm || 0;
    const wet = kind !== 'none', dayF = clamp((elev + 6) / 10, 0, 1), night = 1 - dayF;
    const oc = Math.min(0.9, cloud / 100 * 0.7 + (wet ? 0.25 : 0)), tw = Math.max(0, 1 - Math.abs(elev + 1) / 5);

    // sky
    let top = mix('#0e1530', '#bde6fc', dayF), bottom = mix('#2a3560', '#f8fdff', dayF);
    top = mix(top, mix('#1a2133', '#d3dae1', dayF), oc); bottom = mix(bottom, mix('#2c3446', '#f2f4f6', dayF), oc);
    bottom = mix(bottom, '#f3a56b', tw * 0.7 * (1 - oc)); top = mix(top, '#7a6fa8', tw * 0.35 * (1 - oc));
    const g = ctx.createLinearGradient(0, 0, 0, 590); g.addColorStop(0, top); g.addColorStop(1, bottom);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, 590);
    STARS.forEach((s) => ell(s.x, s.y, s.r, s.r, '#ffffff', night * (1 - oc) * (0.55 + 0.45 * Math.sin(clock * 1.5 + s.tw))));
    const bx = clamp(px, 40, 1160);
    if (elev > -4) { const sy = 380 - elev / 20 * 300; ell(bx, sy, 58, 58, '#fff3b0', (1 - oc * 0.8) * 0.45); ell(bx, sy, 34, 34, '#ffd23f', 1 - oc * 0.6); }
    else { ell(bx, 110, 24, 24, '#f4f1de', 1 - oc * 0.7); ell(bx + 10, 104, 21, 21, top, 1); }
    const cf = mix('#4a5468', wet ? '#b9c1ca' : '#ffffff', dayF);
    CLOUDS.forEach((c) => {
      const x = (((c.x0 + clock * c.sp) % 1500) + 1500) % 1500 - 150, o = 0.15 + 0.8 * cloud / 100;
      ctx.save(); ctx.translate(x, c.y); ctx.scale(c.s, c.s); ell(0, 0, 70, 26, cf, o); ell(-34, -14, 36, 26, cf, o); ell(22, -22, 42, 32, cf, o); ctx.restore();
    });

    // skyline at 50%, street, night overlay, lights
    const sk = skylineFor(st.city);
    ctx.globalAlpha = 0.5; ctx.drawImage(sk.img, 0, 0, W, STREET); ctx.globalAlpha = 1;
    ctx.fillStyle = '#cfc9bd'; ctx.fillRect(0, 470, W, 18); ctx.fillStyle = '#4a4e57'; ctx.fillRect(0, 488, W, 102);
    ctx.fillStyle = '#e6e1d3'; for (let x = 0; x < W; x += 50) ctx.fillRect(x, 538, 28, 3);
    ctx.fillStyle = 'rgba(10,16,40,' + (night * 0.5) + ')'; ctx.fillRect(0, 0, W, 590);
    if (night > 0.05) { ctx.globalAlpha = night * 0.85; ctx.drawImage(sk.lights, 0, 0, W, STREET); ctx.globalAlpha = 1; }

    // chart
    const mode = st.mode;
    let lo, hi;
    if (mode === 'out') { lo = 0; hi = Math.max(1, d.bikes_out_peak_recent_7d || 1); }
    else if (mode === 'active') {                                       // 0 to the window's highest share, rounded up to 10%
      lo = 0; hi = 0; for (let i = w.start; i < d.hours.length; i++) hi = Math.max(hi, d.hours[i].share_stations_active || 0);
      hi = Math.max(0.1, Math.ceil(hi * 10) / 10);
    } else { lo = Infinity; hi = -Infinity; for (let i = w.start; i < d.hours.length; i++) { lo = Math.min(lo, d.hours[i].docked_bikes); hi = Math.max(hi, d.hours[i].docked_bikes); } if (hi - lo < 1) hi = lo + 1; }
    const field = { out: 'bikes_out_est', docked: 'docked_bikes', active: 'share_stations_active' }[mode];
    const fmtV = (v) => (mode === 'active' ? Math.round(v * 100) + '%' : fmt(v));
    const yOf = (v) => CH_BOT - (v - lo) / (hi - lo) * (CH_BOT - CH_TOP);
    for (let h = 0; h < 24; h++) {                                      // grey bands for hours the pipeline filled in
      const q = dayStart + h; if (q > a + 1e-9 || q >= d.hours.length) break;
      const s = d.hours[q].data_status; if (s === 'ok') continue;
      let h1 = h; while (h1 + 1 < 24 && dayStart + h1 + 1 <= a && dayStart + h1 + 1 < d.hours.length && d.hours[dayStart + h1 + 1].data_status === s) h1++;
      const xa = X0 + Math.max(0, h - 0.5) / 24 * XW, xb = X0 + Math.min(24, h1 + 0.5) / 24 * XW;
      ctx.fillStyle = 'rgba(107,114,128,0.28)'; ctx.fillRect(xa, CH_TOP - 2, Math.max(24, xb - xa), STREET - CH_TOP + 2);
      text(STATUS_LABEL[s] || s, (xa + xb) / 2, CH_TOP + 10, '700 11px Inter, sans-serif', '#ffffff');
      h = h1;
    }
    [lo, hi].forEach((v) => {
      const y = yOf(v); ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1; ctx.setLineDash([4, 6]);
      ctx.beginPath(); ctx.moveTo(X0, y); ctx.lineTo(X1, y); ctx.stroke(); ctx.setLineDash([]);
      pill(X0 - 70, y - 10, 62, 20, '#1d2230', 0.7); text(fmtV(v), X0 - 39, y + 0.5, '600 12px Inter, sans-serif', '#ffffff');
    });
    const di = d.dates.indexOf(h0.date_local);
    if (di > 0) {
      const p0 = d.firstIdx[d.dates[di - 1]];
      ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]); ctx.beginPath();
      let pen = false;
      for (let q = p0; q <= p0 + 24 && q < d.hours.length; q += 0.5) { const v = at(d, field, q); if (v == null) { pen = false; continue; } const x = X0 + (q - p0) / 24 * XW, y = yOf(v); pen ? ctx.lineTo(x, y) : ctx.moveTo(x, y); pen = true; }
      ctx.stroke(); ctx.setLineDash([]);
    }
    const pts = [];                                                     // hours without a value (e.g. the latest hour's activity) are skipped
    for (let q = dayStart; q < a; q += 0.25) { const v = at(d, field, q); if (v != null) pts.push([X0 + (q - dayStart) / 24 * XW, yOf(v)]); }
    const vNow = at(d, field, a); if (vNow != null) pts.push([px, yOf(vNow)]);
    const last = pts.length ? pts[pts.length - 1] : [px, CH_BOT];
    ctx.globalAlpha = 0.45; ctx.fillStyle = '#ff7a1a';
    if (pts.length) { ctx.beginPath(); ctx.moveTo(pts[0][0], CH_BOT); pts.forEach((p) => ctx.lineTo(p[0], p[1])); ctx.lineTo(last[0], CH_BOT); ctx.closePath(); ctx.fill(); }
    ctx.globalAlpha = 1;
    const path = new Path2D(); pts.forEach((p, k) => (k ? path.lineTo(p[0], p[1]) : path.moveTo(p[0], p[1])));
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 8; ctx.stroke(path);
    ctx.strokeStyle = '#ff7a1a'; ctx.lineWidth = 4; ctx.stroke(path);
    const py = last[1];
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, 598); ctx.stroke();
    if (vNow != null) { ell(px, py, 9, 9, '#ffffff', 1); ell(px, py, 6, 6, '#ff7a1a', 1); }
    const docked = at(d, 'docked_bikes', a), outNow = at(d, 'bikes_out_est', a);
    const activeNow = at(d, 'share_stations_active', a);
    // marker label shows only the metric of the chart; the city panel shows all three
    const label = mode === 'active' ? (activeNow == null ? 'activity not known yet' : Math.round(activeNow * 100) + '% active')
      : mode === 'docked' ? fmt(docked) + ' docked'
      : '~' + fmt(outNow) + ' out';
    ctx.font = '700 12px Inter, sans-serif';
    const half = Math.ceil(ctx.measureText(label).width / 2) + 12;           // pill sized to the text
    const lx = clamp(px, X0 + half, 1185 - half), ly = py < 230 ? py + 26 : py - 26;
    pill(lx - half, ly - 11, 2 * half, 22, '#ffffff', 0.95); text(label, lx, ly + 0.5, '700 12px Inter, sans-serif', '#1d2230');

    // bikes (count from the pipeline's share of the 7-day peak)
    const share = clamp(at(d, 'bikes_out_share_of_peak', a) ?? 0, 0, 1), n = 9 * share, k = Math.ceil(n - 1e-6);
    const style = STYLES[st.style], spin = st.playing ? clock * 7.3 : 0;
    for (let i = 0; i < k; i++) {
      const lane = i % 3, col = Math.floor(i / 3);
      drawBike(px + 9 - 34 - col * 64 - lane * 10, 514 + lane * 26 + (st.playing ? Math.sin(clock * 9 + i) * 1.2 : 0), 0.88 + lane * 0.07,
        style, spin, night, i < Math.floor(n) ? 1 : n - Math.floor(n));
    }

    // rain / snow (from the pipeline's precipitation_kind)
    if (kind === 'rain') {
      const m = Math.round(Math.min(170, 40 + precip * 110)); ctx.strokeStyle = 'rgba(207,227,255,0.75)'; ctx.lineWidth = 2; ctx.beginPath();
      for (let i = 0; i < m; i++) { const r = DROPS[i], y = ((r.ph * 640 + clock * r.sp * 700) % 640) - 20, x = ((r.x0 - y * 0.18) % 1300 + 1300) % 1300 - 50; ctx.moveTo(x, y); ctx.lineTo(x - 3, y + 16); }
      ctx.stroke();
    } else if (kind === 'snow') {
      const m = Math.round(Math.min(150, 40 + snow * 160)); ctx.fillStyle = 'rgba(255,255,255,0.9)';
      for (let i = 0; i < m; i++) { const r = DROPS[i], y = ((r.ph * 640 + clock * r.sp * 55) % 640) - 20; ctx.beginPath(); ctx.arc(r.x0 - 50 + 12 * Math.sin(clock * 1.3 + r.ph * 30), y, 1.6 + r.ph * 2.2, 0, Math.PI * 2); ctx.fill(); }
    }

    // x axis
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 590, W, 50);
    ctx.fillStyle = '#1d2230'; ctx.fillRect(X0, 589, XW, 2);
    for (let h = 0; h <= 24; h++) {
      const x = X0 + h / 24 * XW, major = h % 3 === 0;
      ctx.fillStyle = major ? '#1d2230' : '#6b7280'; ctx.fillRect(x - (major ? 1 : 0.5), 591, major ? 2 : 1, major ? 12 : 6);
      if (major) text((h < 10 ? '0' : '') + h + ':00', x, 615, '600 14px Inter, sans-serif', '#1d2230');
    }
    text('Hour of day (Zurich time)', X0 + XW / 2, 633, '400 10px Inter, sans-serif', '#5b6272');

    // panels
    $('dayLabel').textContent = h0.weekday_local + ' ' + dmy(h0.date_local);
    $('timeLabel').textContent = h0.hour_local.slice(11, 13) + ':00';
    $('dockedLabel').textContent = fmt(docked); $('outLabel').textContent = '~' + fmt(outNow);
    $('activeLabel').textContent = activeNow == null ? '–' : Math.round(activeNow * 100) + '%';
    $('prevDay').disabled = di <= d.dates.indexOf(d.hours[w.start].date_local); $('nextDay').disabled = di >= d.dates.length - 1;
    $('tempLabel').textContent = (temp == null ? '–' : temp.toFixed(1)) + ' °C';
    $('condLabel').textContent = kind === 'snow' ? 'Snow · ' + snow.toFixed(1) + ' cm/h' : kind === 'rain' ? 'Rain · ' + precip.toFixed(1) + ' mm/h' : cloud > 70 ? 'Overcast' : cloud > 30 ? 'Partly cloudy' : dayF > 0.5 ? 'Sunny' : 'Clear night';
    const di2 = d.dayInfo[h0.date_local] || {};
    $('cloudLabel').textContent = 'Cloud ' + Math.round(cloud) + '% · daylight ' + (di2.sunrise_local || '–') + '–' + (di2.sunset_local || '–');   // sunrise to sunset of the day
    $('fcLabel').textContent = hNear.weather_is_forecast ? 'Forecast (latest weather pull)' : '';
    setIcon(kind, cloud, dayF);
    canvas.setAttribute('aria-label', d.city_name + ', ' + $('dayLabel').textContent + ' ' + $('timeLabel').textContent + ': ' + fmt(docked) + ' bikes docked, about ' + fmt(outNow) + ' out, ' + (activeNow == null ? 'activity not known yet' : Math.round(activeNow * 100) + '% of stations active') + '; ' + $('condLabel').textContent + ', ' + $('tempLabel').textContent);
    if (!st.playing) $('scrub').value = Math.floor(t + 1e-6);
  }
  let lastIcon = '';
  function setIcon(kind, cloud, dayF) {
    const key = kind + (cloud > 70 ? 'c' : '') + (dayF > 0.5 ? 'd' : 'n'); if (key === lastIcon) return; lastIcon = key;
    const cloudP = '<path d="M15 34 A 8 8 0 0 1 16 18 A 11 11 0 0 1 37 20 A 7 7 0 0 1 38 34 Z" fill="none" stroke="#5b6475" stroke-width="3" stroke-linejoin="round"/>';
    let s;
    if (kind === 'rain') s = cloudP + '<path d="M19 39 L16 46 M27 39 L24 46 M35 39 L32 46" stroke="#2f6fd6" stroke-width="3" stroke-linecap="round"/>';
    else if (kind === 'snow') s = cloudP + '<path d="M18 40 V46 M15 43 H21 M30 40 V46 M27 43 H33" stroke="#5b8bd6" stroke-width="2.5" stroke-linecap="round"/>';
    else if (cloud > 70) s = cloudP;
    else if (dayF > 0.5) s = '<circle cx="26" cy="26" r="10" fill="none" stroke="#e2a400" stroke-width="3"/><path d="M26 6 V11 M26 41 V46 M6 26 H11 M41 26 H46 M12 12 L15.5 15.5 M36.5 36.5 L40 40 M12 40 L15.5 36.5 M36.5 15.5 L40 12" stroke="#e2a400" stroke-width="3" stroke-linecap="round"/>';
    else s = '<path d="M33 10 A 16 16 0 1 0 42 34 A 13 13 0 0 1 33 10 Z" fill="none" stroke="#4b5a8a" stroke-width="3" stroke-linejoin="round"/>';
    $('wxIcon').innerHTML = s;
  }

  // ---------- loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now; st.clock += dt;
    if (st.playing && cur()) {
      const w = windowOf(cur()); st.t += dt / st.speed;
      if (st.t >= w.tMax) { st.t = w.tMax; st.playing = false; syncControls(); }
      $('scrub').value = Math.floor(st.t + 1e-6);
    }
    draw(); requestAnimationFrame(loop);
  }

  // ---------- start ----------
  (async () => {
    fit();
    try {
      await document.fonts.ready;
      st.index = await loadJson('cities.json');
      const wanted = hash.get('city'), ids = st.index.cities.map((c) => c.city_id);
      await selectCity(ids.includes(wanted) ? wanted : (ids.includes('zurich') ? 'zurich' : ids[0]));
      renderFooter(st.index);
      $('loading').remove();
      let seen = false; try { seen = !!sessionStorage.getItem('cityHintSeen'); sessionStorage.setItem('cityHintSeen', '1'); } catch (e) { /* storage unavailable */ }
      if (!seen) $('cityHint').classList.add('pulse');
      requestAnimationFrame(loop);
    } catch (e) {
      $('loading').textContent = 'Could not load data/cities.json (' + e.message + '). Serve this folder over HTTP, e.g. "python -m http.server" in visualizations/daily-animation.';
    }
  })();
})();
</script>
</body>
